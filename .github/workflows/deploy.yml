name: CI/CD Production Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-audit:
    name: Quality Gate (JS Syntax, SEO & Security Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript Modules Syntax
        run: |
          for file in js/*.js; do
            echo "Checking $file..."
            node --check "$file"
          done

      - name: Verify SEO, Security & Defensive Code Standards
        run: |
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          grep -q 'rel="canonical"' index.html
          grep -q 'meta name="description"' index.html
          if grep -q 'innerHTML' js/calculator.js; then
            echo "Security error: unsafe innerHTML found in js/calculator.js"
            exit 1
          fi
          echo "All CI quality checks passed."

  deploy-vercel:
    name: Deploy Project Artifacts to Vercel
    needs: qa-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production (when VERCEL_TOKEN is configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN secret is not set; production deploy runs via Vercel Git integration."
          fi
